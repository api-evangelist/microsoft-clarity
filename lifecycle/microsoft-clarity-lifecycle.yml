breaking_change_practice:
  documented: true
  mechanism: >-
    SDK changelog entries are tagged [Breaking], [Feature], [Enhancement],
    [BugFix], [Compatibility] or [Deprecation], and breaking changes land on
    major versions (Android 3.0.0, iOS 3.0.0, React Native 4.0.1, Cordova 3.0.0
    all carried [Breaking] entries on 2024-11-24 / 2025-05-22).
  url: https://learn.microsoft.com/en-us/clarity/mobile-sdk/sdk-changelog
  see: changelog/microsoft-clarity-changelog.yml
sla:
  published: false
  note: >-
    Clarity is a free service with no paid tier, and Microsoft publishes no
    uptime commitment or support SLA for it. Support is an email address,
    clarityMS@microsoft.com, plus Microsoft Q&A.
status_page:
  published: false
  url: null
  note: >-
    Clarity operates NO first-party status page. Searches surface only
    third-party monitors (StatusGator, SaaSHub) which infer status externally.
    Microsoft's status.cloud.microsoft covers Microsoft 365 / Azure services and
    does not list Clarity. No StatusPage pointer is emitted in apis.yml.
data_retention:
