provider: Microsoft Clarity
providerId: microsoft-clarity
description: >-
  Lifecycle posture for Microsoft Clarity. The split matters: Clarity runs a
  disciplined, dated, semver'd release train for its SDKs — with explicit
  [Breaking] and [Deprecation] markers going back to 2023 — but publishes no
  versioning policy, no deprecation policy, no Sunset/Deprecation headers, no
  SLA and no status page for the Data Export HTTP API. The API is a single v1
  path that has not visibly changed.
versioning:
  style: uri-path
  current_version: v1
  path: /export-data/api/v1/project-live-insights
  policy_published: false
  policy_url: null
  note: >-
    No published statement on how versions are introduced or retired for the
    HTTP API.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No RFC 8594 Sunset/Deprecation headers and no written deprecation policy for
    the API. Deprecations ARE announced for SDKs, inside the dated changelog —
    for example iOS 3.0.10 "[Deprecation] Deprecated clarityFontNameHint()
    SwiftUI modifier", and the standing notice that iOS 1.0.0-1.0.2, 2.0.0-2.2.3
    and 3.0.0-3.0.4 "rely on a deprecated CDN and are expected to fail to
    download by early April 2025." Because this is release-note practice rather
    than a published policy, no Deprecation pointer is emitted in apis.yml.
