  labels_months: 9
  quote: >-
    Clarity retains recordings for 30 days from the time of recording. However,
    Favorite recordings and randomly selected sample of recordings are retained
    for up to 9 months.
  source: https://learn.microsoft.com/en-us/clarity/faq
