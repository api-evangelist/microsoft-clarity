name: Microsoft Clarity
description: >-
  Microsoft Clarity is a free behavioral analytics service from Microsoft that
  captures heatmaps, session recordings and frustration signals — rage clicks,
  dead clicks, excessive scroll, quickback clicks and script errors — for
  websites and mobile apps. Instrumentation is a client-side tracking tag or a
  first-party SDK for Android, iOS, Flutter, React Native and Cordova. Data
  comes back out through the Data Export API, a single JWT-authenticated GET
  that returns dashboard metrics for the last one to three days broken down by
  up to three dimensions, and through a first-party Model Context Protocol
  server that wraps the same endpoint for AI agents. Clarity is free forever
  with no paid tier; the binding constraint on any integration is a quota of ten
  API requests per project per day.
