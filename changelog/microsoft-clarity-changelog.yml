description: >-
  Microsoft Clarity maintains a dated, per-platform SDK changelog on Microsoft
  Learn covering Android, iOS, Flutter, React Native and Cordova/Ionic. Every
  entry carries a semver version, a calendar date and a change class tag
  ([Feature] / [Enhancement] / [BugFix] / [Breaking] / [Deprecation] /
  [Compatibility]). There is NO changelog for the Data Export HTTP API — that
  surface has published no dated change history at all.
