description: >-
  /.well-known/ probe across the Clarity API host (www.clarity.ms), the product
  console/marketing host (clarity.microsoft.com), the documentation host
  (learn.microsoft.com) and the operating company's root domain
  (www.microsoft.com). Clarity's own hosts serve no /.well-known/ documents.
  The only real hit in the set is Microsoft's corporate security.txt, served
  from www.microsoft.com — that document covers MSRC for all Microsoft
  products including Clarity, and it is the same document already recorded in
  security/microsoft-clarity-vulnerability-disclosure.yml.
important_caveat: >-
  clarity.microsoft.com answers HTTP 200 with the same SPA HTML shell for EVERY
  path, including every /.well-known/* path and every OpenAPI filename. Those
  200s are NOT documents and are recorded below as misses (spa_shell: true).
  Only www.microsoft.com/.well-known/security.txt returned a real document.
