distributions:
  - name: Clarity tracking tag
    registry: cdn
    url: https://www.clarity.ms/tag/<PROJECT_ID>
    official: true
    version: null
    published: null
    note: >-
      The copy-and-paste install snippet loads the tracking script from
      https://www.clarity.ms/tag/<PROJECT_ID>. The URL carries no version
      segment, so the build floats to whatever Clarity is currently serving and
      a consumer cannot pin or identify the version they are running. Probed
      2026-08-13: HTTP 204 for an unknown project id (host is live, project
      gating is server-side). Recorded as version: null because the
      distribution is unpinned, not because it was unchecked.
